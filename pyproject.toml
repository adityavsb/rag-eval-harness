[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "A production-grade evaluation harness and benchmarking suite for Retrieval-Augmented Generation (RAG)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aditya Bhadoria", email = "adityavsb@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "langchain>=0.2.14",
    "langchain-core>=0.2.33",
    "langchain-community>=0.2.12",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.5",
    "mlflow>=2.15.0",
    "openai>=1.40.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "litellm>=1.40.0",
    "rank-bm25>=0.2.2",
    "dspy>=2.5.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
