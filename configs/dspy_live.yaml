run_name: "dspy-compiled-rag-live"
description: "Live DSPy compiled RAG on hybrid RRF retrieval. Compile with src/optimize/compile.py before scoring; the program is trained on train/dev and this config is for a later harness run."
mode: "live"

corpus:
  data_dir: "data/raw"
  file_pattern: "*.md"

chunking:
  strategy: "recursive"
  chunk_size: 400
  chunk_overlap: 50

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"

vector_store:
  persist_directory: "chroma_db/hybrid"
  collection_name: "hybrid_collection"

retriever:
  top_k: 4
  retrieval_mode: "hybrid"
  rrf_k: 60
  use_reranker: false

generation:
  mode: "live"
  provider: "openrouter"
  model_name: "deepseek/deepseek-v4.1-flash"
  temperature: 0.0
  max_tokens: 4000
  timeout_sec: 120.0
  pacing_delay_sec: 1.0
  prompt_style: "dspy"
  compiled_dspy_program_path: "src/optimize/compiled_dspy_rag.openrouter.json"

evaluation:
  mode: "live"
  judge_provider: "openrouter"
  judge_model: "perplexity/pplx-decider-flash-v1.2"
  stage: "full"
  timeout_sec: 120.0
  checkpoint_dir: "reports/live/checkpoints"
  golden_qa_path: "data/golden_qa.json"

tracking:
  experiment_name: "rag-evaluation-benchmark"
  tracking_uri: "sqlite:///mlflow.db"
