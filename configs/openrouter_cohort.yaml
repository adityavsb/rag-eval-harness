run_name: "openrouter-tri-model-eval"
description: "Empirical evaluation of OpenRouter cohort: DeepSeek V4.1 Flash, Qwen 3.7 Flash, and Perplexity PPLX Decider Flash."
mode: "live"

corpus:
  data_dir: "data/raw"
  file_pattern: "*.md"

chunking:
  strategy: "recursive"
  chunk_size: 400
  chunk_overlap: 50

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"

vector_store:
  persist_directory: "chroma_db/hybrid"
  collection_name: "hybrid_collection"

retriever:
  top_k: 4
  retrieval_mode: "hybrid"
  rrf_k: 60
  use_reranker: false

generation:
  mode: "live"
  provider: "openrouter"
  model_name: "deepseek/deepseek-v4.1-flash"
  reasoning_model: "qwen/qwen3.7-flash"
  temperature: 0.0
  max_tokens: 500
  timeout_sec: 120.0
  pacing_delay_sec: 1.0
  prompt_style: "grounded"

evaluation:
  mode: "live"
  judge_provider: "openrouter"
  judge_model: "perplexity/pplx-decider-flash-v1.2"
  stage: "full"
  timeout_sec: 120.0
  checkpoint_dir: "reports/live/checkpoints"
  golden_qa_path: "data/golden_qa.json"

tracking:
  experiment_name: "rag-evaluation-benchmark"
  tracking_uri: "sqlite:///mlflow.db"
