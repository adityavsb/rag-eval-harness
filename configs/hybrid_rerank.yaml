run_name: "hybrid-rerank-rag"
description: "Two-stage Hybrid RAG: Retrieve top 15 with BM25 + Dense RRF (k=60), rerank to top 4 using Cross-Encoder"

corpus:
  data_dir: "data/raw"
  file_pattern: "*.md"

chunking:
  strategy: "recursive"
  chunk_size: 400
  chunk_overlap: 50

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"

vector_store:
  persist_directory: "chroma_db/hybrid_rerank"
  collection_name: "hybrid_rerank_collection"

retriever:
  top_k: 15
  retrieval_mode: "hybrid"
  rrf_k: 60
  use_reranker: true
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  reranker_top_n: 4

generation:
  model_name: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 500
  prompt_style: "grounded"

evaluation:
  golden_qa_path: "data/golden_qa.json"
  judge_model: "gpt-4o-mini"
  metrics:
    - "hit_rate_at_k"
    - "mrr_at_k"
    - "context_recall"
    - "faithfulness"
    - "answer_correctness"

tracking:
  experiment_name: "rag-evaluation-benchmark"
  tracking_uri: "sqlite:///mlflow.db"
